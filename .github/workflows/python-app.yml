steps:
- uses: actions/checkout@v4

- name: Set up Python 3.10
  uses: actions/setup-python@v4
  with:
    python-version: "3.10"

- name: Cache pip
  uses: actions/cache@v4
  with:
    path: ~/.cache/pip
    key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
    restore-keys: |
      ${{ runner.os }}-pip-

- name: Install system build deps (for cryptography, if needed)
  if: runner.os == 'Linux'
  run: |
    sudo apt-get update
    sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev || true

- name: Install dependencies
  run: |
    python -m pip install --upgrade pip
    pip install wheel
    # Prefer requirements.txt when present; otherwise install required packages
    if [ -f requirements.txt ]; then
      pip install -r requirements.txt
    else
      pip install flake8 pytest securesystemslib urllib3 cryptography freezegun
    fi

- name: Lint with flake8
  run: |
    flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

- name: Test with pytest
  run: |
    pytest
